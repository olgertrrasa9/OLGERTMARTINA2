<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olgert & Martina - Il nostro matrimonio</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #f6efe3;
      color: #333;
    }

    header {
      height: 100vh;
      background:
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
        url("https://images.unsplash.com/photo-1520974735194-6c44c3b63b2a") center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.3rem;
      letter-spacing: 2px;
    }

    .lang {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    .lang button {
      margin-left: 5px;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #c9a24d;
      color: white;
      font-weight: 500;
    }

    section {
      padding: 80px 20px;
      background-color: #f6efe3;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .section-title h2 {
      text-align: center;
      font-family: 'Playfair Display', serif;
      color: #9c7a2f;
      font-size: 2.5rem;
      margin-bottom: 30px;
    }

    .intro-text {
      text-align: center;
      font-style: italic;
      font-size: 1.1rem;
      line-height: 1.6;
      max-width: 700px;
      margin: 0 auto 25px;
    }

    .gold-line {
      width: 80px;
      height: 2px;
      background-color: #c9a24d;
      margin: 0 auto 35px;
    }

    .fade {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s ease, transform 1s ease;
    }

    .fade.show {
      opacity: 1;
      transform: translateY(0);
    }

    .story {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 40px;
      align-items: center;
      text-align: center;
    }

    .story img,
    .gallery img,
    .hotel img {
      width: 100%;
      max-width: 500px;
      margin: auto;
      display: block;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .gallery {
      display: flex;
      justify-content: center;
    }

    .hotels {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 40px;
      margin-top: 40px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }

    .card h3 {
      font-family: 'Playfair Display', serif;
      color: #9c7a2f;
      margin-bottom: 15px;
    }

    .whatsapp a {
      display: inline-block;
      padding: 15px 30px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-size: 1.1rem;
      margin-top: 20px;
    }

    .countdown {
      text-align: center;
      font-size: 1.6rem;
      color: #9c7a2f;
      margin-top: 20px;
    }

    footer {
      background: #2f2f2f;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 2.8rem;
      }

      header p {
        font-size: 1rem;
        padding: 0 15px;
      }

      section {
        padding: 60px 15px;
      }
    }
  </style>
</head>

<body>

  <div class="lang">
    <button onclick="setLang('it')">IT</button>
    <button onclick="setLang('sq')">AL</button>
  </div>

  <header>
    <div>
      <h1>Olgert & Martina</h1>
      <p id="hero-text">Sabato 25 Aprile · Ore 11:00 · Albania</p>
    </div>
  </header>

  <section class="fade">
    <div class="container">

      <p id="story-text" class="intro-text">
        Con grande gioia vi invitiamo a condividere con noi
        il giorno più importante della nostra vita.
      </p>

      <div class="gold-line"></div>

      <div class="section-title">
        <h2 id="title-story">Il nostro sì</h2>
      </div>

      <div class="story">
        <img src="https://private-user-images.githubusercontent.com/255133667/536242939-a51eaf25-f8ea-4159-84ac-8f8868dec572.jpeg" alt="Olgert e Martina">
      </div>

    </div>
  </section>

  <footer>
    <p>Con amore, Olgert & Martina</p>
  </footer>

</body>
</html>
