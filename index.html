<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Matrimonio">
<meta name="theme-color" content="#ffffff">
<title>Matrimonio</title>
<style>
:root {
  --gold: #B8924A;
  --gold-light: #F7F0E4;
  --gold-dark: #7A5C28;
  --bg: #ffffff;
  --bg2: #F8F7F5;
  --bg3: #F0EDE8;
  --text: #1A1814;
  --text2: #6B6560;
  --text3: #A09890;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.14);
  --green-bg: #EDFAF3; --green-fg: #1A6B42;
  --orange-bg: #FFF7E6; --orange-fg: #9C6A00;
  --red-bg: #FFF0F0; --red-fg: #C0392B;
  --blue-bg: #EEF4FF; --blue-fg: #1A3B8C;
  --radius: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121110; --bg2: #1C1B19; --bg3: #252320;
    --text: #F5F2ED; --text2: #9A948C; --text3: #5A5550;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --gold-light: #2A2218;
    --green-bg: #0D2B1E; --green-fg: #4ABA80;
    --orange-bg: #2B1E08; --orange-fg: #FFBA45;
    --red-bg: #2B0E0E; --red-fg: #FF7070;
    --blue-bg: #0E1A2B; --blue-fg: #7BA8FF;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: -apple-system, 'Helvetica Neue', sans-serif; background: var(--bg); color: var(--text); overscroll-behavior: none; }

/* LAYOUT */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 500px; margin: 0 auto; position: relative; }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.page { display: none; padding: 0 16px 100px; }
.page.active { display: block; }

/* TOPBAR */
.topbar {
  background: var(--bg);
  border-bottom: 0.5px solid var(--border);
  padding: 14px 16px 0;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  position: sticky; top: 0; z-index: 20;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  background: rgba(var(--bg-rgb, 255,255,255), 0.92);
}
.topbar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.topbar-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
.topbar-date { font-size: 12px; color: var(--text3); }
.tabs { display: flex; gap: 0; }
.tab {
  flex: 1; text-align: center; padding: 10px 4px 11px; font-size: 13px; font-weight: 500;
  color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s; user-select: none;
}
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }

/* SECTION TITLE */
.sec { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin: 20px 0 10px; }

/* METRIC CARDS */
.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
.metric-card { background: var(--bg2); border-radius: var(--radius); padding: 14px; }
.metric-label { font-size: 11px; color: var(--text3); margin-bottom: 5px; font-weight: 500; }
.metric-value { font-size: 26px; font-weight: 700; letter-spacing: -1px; color: var(--text); line-height: 1; }
.metric-card.green .metric-value { color: var(--green-fg); }
.metric-card.orange .metric-value { color: var(--orange-fg); }
.metric-card.red .metric-value { color: var(--red-fg); }
.metric-card.gold .metric-value { color: var(--gold); }

/* BUDGET SUMMARY */
.budget-box { background: var(--bg2); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.budget-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
.budget-row + .budget-row { border-top: 0.5px solid var(--border); }
.budget-label { font-size: 13px; color: var(--text2); }
.budget-val { font-size: 15px; font-weight: 600; }
.budget-val.green { color: var(--green-fg); }
.budget-val.orange { color: var(--orange-fg); }
.budget-val.blue { color: var(--blue-fg); }
.budget-val.total { font-size: 19px; letter-spacing: -0.5px; color: var(--text); }

/* ALLERGIE */
.allergia-card { display: flex; align-items: center; gap: 12px; background: var(--red-bg); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; cursor: pointer; }
.allergia-name { font-size: 14px; font-weight: 600; color: var(--red-fg); }
.allergia-note { font-size: 12px; color: var(--red-fg); opacity: 0.8; margin-top: 2px; }

/* SEARCH & FILTERS */
.search-wrap { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 0; }
.search-input {
  width: 100%; padding: 11px 14px; font-size: 16px;
  border: 0.5px solid var(--border2); border-radius: var(--radius);
  background: var(--bg2); color: var(--text); outline: none;
  -webkit-appearance: none; appearance: none;
}
.search-input:focus { border-color: var(--gold); }
.filter-row { display: flex; gap: 6px; padding: 10px 0 4px; overflow-x: auto; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-btn {
  flex-shrink: 0; font-size: 12px; font-weight: 500; padding: 6px 14px;
  border-radius: 20px; border: 0.5px solid var(--border2);
  background: var(--bg); color: var(--text2); cursor: pointer; white-space: nowrap;
  transition: all 0.12s; -webkit-appearance: none;
}
.filter-btn.active { background: var(--gold); color: white; border-color: var(--gold); }

/* GUEST LIST */
.guest-list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
.guest-card {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg); border: 0.5px solid var(--border);
  border-radius: var(--radius); padding: 13px; cursor: pointer;
  transition: background 0.1s;
  -webkit-user-select: none; user-select: none;
}
.guest-card:active { background: var(--bg2); }
.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; flex-shrink: 0; letter-spacing: -0.5px;
}
.guest-info { flex: 1; min-width: 0; }
.guest-name { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.guest-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.badge { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 20px; flex-shrink: 0; }
.badge.si { background: var(--green-bg); color: var(--green-fg); }
.badge.attesa { background: var(--orange-bg); color: var(--orange-fg); }
.badge.no { background: var(--red-bg); color: var(--red-fg); }

/* EXPENSE LIST */
.expense-list { display: flex; flex-direction: column; gap: 10px; }
.exp-card {
  background: var(--bg); border: 0.5px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; cursor: pointer;
  transition: background 0.1s;
}
.exp-card:active { background: var(--bg2); }
.exp-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.exp-name { font-size: 15px; font-weight: 600; color: var(--text); }
.exp-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.exp-amount { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; text-align: right; }
.exp-amount.tbd { font-size: 13px; font-weight: 500; color: var(--text3); }
.progress-track { height: 4px; background: var(--bg3); border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
.progress-fill { height: 100%; border-radius: 4px; background: var(--green-fg); transition: width 0.4s ease; }
.exp-row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
.exp-row .lbl { color: var(--text2); }
.exp-row .val { font-weight: 600; }
.exp-row .val.green { color: var(--green-fg); }
.exp-row .val.orange { color: var(--orange-fg); }

/* FAB */
.fab {
  position: fixed; bottom: calc(80px + var(--safe-bottom)); right: 20px;
  width: 56px; height: 56px; border-radius: 28px;
  background: var(--gold); color: white;
  border: none; font-size: 28px; line-height: 56px; text-align: center;
  cursor: pointer; box-shadow: 0 4px 20px rgba(184,146,74,0.4);
  z-index: 15; transition: transform 0.15s, box-shadow 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.fab:active { transform: scale(0.93); box-shadow: 0 2px 10px rgba(184,146,74,0.3); }

/* TAB BAR */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 500px;
  background: var(--bg); border-top: 0.5px solid var(--border);
  display: flex; padding-bottom: var(--safe-bottom);
  z-index: 20; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.tabbar-btn { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0 8px; cursor: pointer; gap: 3px; }
.tabbar-icon { font-size: 20px; line-height: 1; }
.tabbar-label { font-size: 10px; font-weight: 500; color: var(--text3); }
.tabbar-btn.active .tabbar-label { color: var(--gold); }

/* MODAL */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.45); z-index: 50;
  align-items: flex-end; justify-content: center;
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
}
.overlay.open { display: flex; }
.sheet {
  background: var(--bg); border-radius: 20px 20px 0 0;
  width: 100%; max-width: 500px;
  max-height: 90vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 8px 20px calc(20px + var(--safe-bottom));
  animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.handle { width: 36px; height: 4px; background: var(--bg3); border-radius: 2px; margin: 8px auto 16px; }
.sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 18px; letter-spacing: -0.3px; }

/* FORM */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.06em; }
.form-input, .form-select {
  width: 100%; padding: 13px 14px; font-size: 16px;
  border: 0.5px solid var(--border2); border-radius: 12px;
  background: var(--bg2); color: var(--text); outline: none;
  -webkit-appearance: none; appearance: none;
  transition: border-color 0.15s;
}
.form-input:focus, .form-select:focus { border-color: var(--gold); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn-primary {
  width: 100%; padding: 15px; font-size: 16px; font-weight: 700;
  background: var(--gold); color: white; border: none;
  border-radius: 14px; cursor: pointer; margin-top: 8px;
  transition: opacity 0.15s; letter-spacing: -0.2px;
}
.btn-primary:active { opacity: 0.85; }
.btn-ghost {
  width: 100%; padding: 13px; font-size: 15px; font-weight: 500;
  background: transparent; color: var(--text2);
  border: 0.5px solid var(--border2); border-radius: 14px;
  cursor: pointer; margin-top: 8px; transition: background 0.12s;
}
.btn-ghost:active { background: var(--bg2); }
.btn-danger { color: var(--red-fg) !important; border-color: var(--red-fg) !important; }

/* DETAIL */
.detail-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.detail-avatar { width: 52px; height: 52px; border-radius: 26px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.detail-name { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
.detail-cat { font-size: 13px; color: var(--text2); margin-top: 2px; }
.detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 0.5px solid var(--border); font-size: 14px; }
.detail-row:last-of-type { border-bottom: none; }
.detail-key { color: var(--text2); }
.detail-val { font-weight: 600; }
.conf-buttons { display: flex; gap: 8px; margin: 16px 0 4px; }
.conf-btn {
  flex: 1; padding: 11px 6px; border-radius: 12px;
  border: 0.5px solid var(--border2); background: var(--bg2);
  color: var(--text2); font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all 0.12s; text-align: center;
}
.conf-btn.sel-si { background: var(--green-bg); color: var(--green-fg); border-color: var(--green-fg); }
.conf-btn.sel-attesa { background: var(--orange-bg); color: var(--orange-fg); border-color: var(--orange-fg); }
.conf-btn.sel-no { background: var(--red-bg); color: var(--red-fg); border-color: var(--red-fg); }
.note-tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 10px; background: var(--red-bg); color: var(--red-fg); border-radius: 20px; margin-top: 4px; }

.empty { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 14px; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="topbar-head">
      <div class="topbar-title">💒 Matrimonio</div>
      <div class="topbar-date" id="topbar-date"></div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('home')">Riepilogo</div>
      <div class="tab" onclick="switchTab('invitati')">Invitati</div>
      <div class="tab" onclick="switchTab('spese')">Spese</div>
    </div>
  </div>

  <div class="content">
    <!-- HOME -->
    <div class="page active" id="page-home">
      <p class="sec" style="margin-top:16px">Invitati</p>
      <div class="metric-grid" id="home-inv"></div>
      <p class="sec">Budget</p>
      <div class="budget-box" id="home-budget"></div>
      <div class="metric-grid" id="home-extra"></div>
      <div id="home-allergie"></div>
    </div>

    <!-- INVITATI -->
    <div class="page" id="page-invitati">
      <div class="search-wrap">
        <input class="search-input" type="search" placeholder="Cerca nome o categoria..." id="search" oninput="renderGuests()">
        <div class="filter-row" id="filters"></div>
      </div>
      <div class="guest-list" id="glist"></div>
    </div>

    <!-- SPESE -->
    <div class="page" id="page-spese">
      <p class="sec" style="margin-top:16px">Tocca una voce per modificarla</p>
      <div class="expense-list" id="elist"></div>
    </div>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="fabClick()">+</button>

<!-- TAB BAR -->
<div class="tabbar">
  <div class="tabbar-btn active" id="tb-home" onclick="switchTab('home')">
    <div class="tabbar-icon">📊</div><div class="tabbar-label">Riepilogo</div>
  </div>
  <div class="tabbar-btn" id="tb-invitati" onclick="switchTab('invitati')">
    <div class="tabbar-icon">👥</div><div class="tabbar-label">Invitati</div>
  </div>
  <div class="tabbar-btn" id="tb-spese" onclick="switchTab('spese')">
    <div class="tabbar-icon">💰</div><div class="tabbar-label">Spese</div>
  </div>
</div>

<!-- ADD GUEST MODAL -->
<div class="overlay" id="modal-guest">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-title" id="guest-modal-title">Aggiungi invitato</div>
    <div class="form-group"><label class="form-label">Nome / Gruppo</label><input class="form-input" id="f-nome" placeholder="Es. Marco e Giulia"></div>
    <div class="form-group"><label class="form-label">Categoria</label>
      <select class="form-select" id="f-cat">
        <option>Amici</option><option>Lavoro</option><option>FISI BABIT</option>
        <option>FISI MAMIT</option><option>Vicini</option><option>Famiglia</option><option>FAMIGLIA MARTINA</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Adulti</label><input class="form-input" id="f-adulti" type="number" min="0" value="2" inputmode="numeric"></div>
      <div class="form-group"><label class="form-label">Bambini</label><input class="form-input" id="f-bambini" type="number" min="0" value="0" inputmode="numeric"></div>
    </div>
    <div class="form-group"><label class="form-label">Conferma</label>
      <select class="form-select" id="f-conf">
        <option value="In attesa">⏳ In attesa</option>
        <option value="Si">✅ Sì</option>
        <option value="No">❌ No</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Hotel (opzionale)</label><input class="form-input" id="f-hotel" placeholder="Nome hotel"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Notti</label><input class="form-input" id="f-notti" type="number" min="0" value="0" inputmode="numeric"></div>
      <div class="form-group"><label class="form-label">Note / Allergie</label><input class="form-input" id="f-note" placeholder="Vegano..."></div>
    </div>
    <input type="hidden" id="f-id">
    <button class="btn-primary" onclick="saveGuest()">Salva</button>
    <button class="btn-ghost" onclick="closeModal('modal-guest')">Annulla</button>
  </div>
</div>

<!-- EXPENSE MODAL -->
<div class="overlay" id="modal-expense">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-title" id="exp-modal-title">Aggiungi spesa</div>
    <div class="form-group"><label class="form-label">Voce</label><input class="form-input" id="e-nome" placeholder="Es. Fotografo"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Importo totale (€)</label><input class="form-input" id="e-importo" type="number" min="0" step="0.01" inputmode="decimal"></div>
      <div class="form-group"><label class="form-label">Acconto pagato (€)</label><input class="form-input" id="e-acconto" type="number" min="0" step="0.01" value="0" inputmode="decimal"></div>
    </div>
    <div class="form-group"><label class="form-label">Note</label><input class="form-input" id="e-note" placeholder="Dettagli..."></div>
    <input type="hidden" id="e-id">
    <button class="btn-primary" onclick="saveExpense()">Salva</button>
    <button class="btn-ghost btn-danger" id="e-delete-btn" onclick="deleteExpense()" style="display:none">Elimina spesa</button>
    <button class="btn-ghost" onclick="closeModal('modal-expense')">Annulla</button>
  </div>
</div>

<!-- GUEST DETAIL MODAL -->
<div class="overlay" id="modal-detail">
  <div class="sheet" id="detail-content"></div>
</div>

// ── STATE ────────────────────────────────────────────────────────────────────
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s && s.guests && s.expenses) return s;
  } catch(e) {}
  return { guests: DEFAULT_GUESTS.map(g=>({...g})), expenses: DEFAULT_EXPENSES.map(e=>({...e})), nextGid: 200, nextEid: 100 };
}
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }

let state = load();
let activeTab = 'home';
let filterConf = 'tutti';

// ── UTILS ────────────────────────────────────────────────────────────────────
function initials(name) {
  return name.split(/[\s\/eedhe&]+/i).filter(Boolean).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?';
}
function fmt(n) {
  return '€' + Math.round(n||0).toLocaleString('it-IT');
}
function fmtDec(n) {
  return '€' + (n||0).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function stats() {
  const g = state.guests;
  const si = g.filter(x=>x.conf==='Si'), att = g.filter(x=>x.conf==='In attesa'), no = g.filter(x=>x.conf==='No');
  return {
    siA: si.reduce((a,x)=>a+x.adulti,0), siB: si.reduce((a,x)=>a+x.bambini,0), siG: si.length,
    attA: att.reduce((a,x)=>a+x.adulti,0), attB: att.reduce((a,x)=>a+x.bambini,0), attG: att.length,
    noG: no.length, noA: no.reduce((a,x)=>a+x.adulti,0),
  };
}
function budget() {
  const e = state.expenses;
  const tot = e.reduce((a,x)=>a+(x.importo||0),0);
  const pag = e.reduce((a,x)=>a+(x.acconto||0),0);
  return { tot, pag, saldo: tot-pag };
}

// ── RENDER HOME ───────────────────────────────────────────────────────────────
function renderHome() {
  const s = stats(), b = budget();
  const confTot = s.siA + s.siB;
  const cpp = confTot > 0 ? Math.round(b.tot / confTot) : 0;

  document.getElementById('home-inv').innerHTML = `
    <div class="metric-card green"><div class="metric-label">Confermati</div><div class="metric-value">${s.siA+s.siB}</div></div>
    <div class="metric-card orange"><div class="metric-label">In attesa</div><div class="metric-value">${s.attA+s.attB}</div></div>
    <div class="metric-card"><div class="metric-label">Adulti conf.</div><div class="metric-value">${s.siA}</div></div>
    <div class="metric-card"><div class="metric-label">Bambini conf.</div><div class="metric-value">${s.siB}</div></div>
  `;
  document.getElementById('home-budget').innerHTML = `
    <div class="budget-row"><span class="budget-label">Budget totale</span><span class="budget-val blue">${fmt(b.tot)}</span></div>
    <div class="budget-row"><span class="budget-label">Acconti pagati</span><span class="budget-val green">${fmt(b.pag)}</span></div>
    <div class="budget-row"><span class="budget-label">Saldo restante</span><span class="budget-val orange total">${fmt(b.saldo)}</span></div>
  `;
  document.getElementById('home-extra').innerHTML = `
    <div class="metric-card gold"><div class="metric-label">Costo/persona</div><div class="metric-value" style="font-size:20px">${fmt(cpp)}</div></div>
    <div class="metric-card red"><div class="metric-label">Non vengono</div><div class="metric-value">${s.noG} gr.</div></div>
  `;
  const all = state.guests.filter(g=>g.note && g.conf!=='No');
  document.getElementById('home-allergie').innerHTML = all.length
    ? `<p class="sec">Allergie & note</p>` + all.map(g=>`
      <div class="allergia-card" onclick="openDetail(${g.id})">
        <div class="avatar" style="background:${(CAT_COLORS[g.cat]||{bg:'#eee'}).bg};color:${(CAT_COLORS[g.cat]||{fg:'#666'}).fg};width:36px;height:36px;font-size:12px">${initials(g.nome)}</div>
        <div><div class="allergia-name">${g.nome}</div><div class="allergia-note">${g.note}</div></div>
      </div>`).join('') : '';
}

// ── RENDER GUESTS ─────────────────────────────────────────────────────────────
function renderGuests() {
  const q = (document.getElementById('search').value||'').toLowerCase();
  const filters = ['tutti','✅ Sì','⏳ Attesa','❌ No'];
  document.getElementById('filters').innerHTML = filters.map(f=>`
    <button class="filter-btn ${filterConf===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('');

  const filtered = state.guests.filter(g=>{
    const ms = !q || g.nome.toLowerCase().includes(q) || g.cat.toLowerCase().includes(q);
    const ml = filterConf==='tutti' ||
      (filterConf==='✅ Sì' && g.conf==='Si') ||
      (filterConf==='⏳ Attesa' && g.conf==='In attesa') ||
      (filterConf==='❌ No' && g.conf==='No');
    return ms && ml;
  });

  if(!filtered.length) { document.getElementById('glist').innerHTML='<div class="empty">Nessun invitato trovato</div>'; return; }
  const cc = CAT_COLORS;
  document.getElementById('glist').innerHTML = filtered.map(g=>{
    const c = cc[g.cat]||{bg:'#eee',fg:'#666'};
    const bc = g.conf==='Si'?'si':g.conf==='In attesa'?'attesa':'no';
    const bl = g.conf==='Si'?'✅':g.conf==='In attesa'?'⏳':'❌';
    const tot = g.adulti+g.bambini;
    return `<div class="guest-card" onclick="openDetail(${g.id})">
      <div class="avatar" style="background:${c.bg};color:${c.fg}">${initials(g.nome)}</div>
      <div class="guest-info">
        <div class="guest-name">${g.nome}</div>
        <div class="guest-sub">${g.cat} · ${tot} pers.</div>
      </div>
      <div class="badge ${bc}">${bl}</div>
    </div>`;
  }).join('');
}
function setFilter(f) { filterConf=f; renderGuests(); }

// ── RENDER EXPENSES ────────────────────────────────────────────────────────────
function renderExpenses() {
  document.getElementById('elist').innerHTML = state.expenses.map(e=>{
    const saldo = Math.max(0,(e.importo||0)-(e.acconto||0));
    const pct = e.importo>0 ? Math.min(100,Math.round((e.acconto/e.importo)*100)) : 0;
    const tbd = !e.importo;
    return `<div class="exp-card" onclick="openExpenseEdit(${e.id})">
      <div class="exp-header">
        <div><div class="exp-name">${e.nome}</div>${e.note?`<div class="exp-sub">${e.note}</div>`:''}</div>
        <div class="exp-amount ${tbd?'tbd':''}">${tbd?'Da definire':fmt(e.importo)}</div>
      </div>
      ${!tbd?`
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="exp-row"><span class="lbl">Acconto pagato</span><span class="val green">${fmt(e.acconto)}</span></div>
      <div class="exp-row"><span class="lbl">Saldo restante</span><span class="val ${saldo>0?'orange':''}">${saldo>0?fmt(saldo):'Saldato ✓'}</span></div>
      `:`<div class="exp-row"><span class="lbl" style="font-style:italic">Tocca per aggiungere l'importo</span></div>`}
    </div>`;
  }).join('');
}

    <button class="btn-ghost btn-danger" onclick="deleteGuest(${id})">Elimina</button>

function setConf(id, conf) {
  const g = state.guests.find(x=>x.id===id); if(!g) return;
  g.conf=conf; save(); closeModal('modal-detail'); renderAll();
}
function deleteGuest(id) {
  if(!confirm('Eliminare questo invitato?')) return;
  state.guests = state.guests.filter(x=>x.id!==id);
  save(); closeModal('modal-detail'); renderAll();
}

}
function openGuestAdd() {
  document.getElementById('guest-modal-title').textContent='Aggiungi invitato';
  document.getElementById('f-nome').value='';
  document.getElementById('f-cat').value='Amici';
  document.getElementById('f-adulti').value=2;
  document.getElementById('f-bambini').value=0;
  document.getElementById('f-conf').value='In attesa';
  document.getElementById('f-hotel').value='';
  document.getElementById('f-notti').value=0;
  document.getElementById('f-note').value='';
  document.getElementById('f-id').value='';
  openModal('modal-guest');
}
function openGuestEdit(id) {
  const g = state.guests.find(x=>x.id===id); if(!g) return;
  document.getElementById('guest-modal-title').textContent='Modifica invitato';
  document.getElementById('f-nome').value=g.nome;
  document.getElementById('f-cat').value=g.cat;
  document.getElementById('f-adulti').value=g.adulti;
  document.getElementById('f-bambini').value=g.bambini;
  document.getElementById('f-conf').value=g.conf;
  document.getElementById('f-hotel').value=g.hotel||'';
  document.getElementById('f-notti').value=g.notti||0;
  document.getElementById('f-note').value=g.note||'';
  document.getElementById('f-id').value=id;
  openModal('modal-guest');
}
function saveGuest() {
  const nome = document.getElementById('f-nome').value.trim();
  if(!nome) { alert('Inserisci un nome'); return; }
  const data = {
    nome, cat: document.getElementById('f-cat').value,
    adulti: parseInt(document.getElementById('f-adulti').value)||0,
    bambini: parseInt(document.getElementById('f-bambini').value)||0,
    conf: document.getElementById('f-conf').value,
    hotel: document.getElementById('f-hotel').value.trim(),
    notti: parseInt(document.getElementById('f-notti').value)||0,
    note: document.getElementById('f-note').value.trim(),
  };
  const eid = document.getElementById('f-id').value;
  if(eid) {
    const idx = state.guests.findIndex(x=>x.id===parseInt(eid));
    if(idx>=0) state.guests[idx]={...state.guests[idx],...data};
  } else {
    state.guests.push({id: state.nextGid++, ...data});
  }
  save(); closeModal('modal-guest'); renderAll();
}

// ── EXPENSE FORM ──────────────────────────────────────────────────────────────
function openExpenseAdd() {
  document.getElementById('exp-modal-title').textContent='Aggiungi spesa';
  document.getElementById('e-nome').value='';
  document.getElementById('e-importo').value='';
  document.getElementById('e-acconto').value='0';
  document.getElementById('e-note').value='';
  document.getElementById('e-id').value='';
  document.getElementById('e-delete-btn').style.display='none';
  openModal('modal-expense');
}
function openExpenseEdit(id) {
  const e = state.expenses.find(x=>x.id===id); if(!e) return;
  document.getElementById('exp-modal-title').textContent='Modifica spesa';
  document.getElementById('e-nome').value=e.nome;
  document.getElementById('e-importo').value=e.importo||'';
  document.getElementById('e-acconto').value=e.acconto||0;
  document.getElementById('e-note').value=e.note||'';
  document.getElementById('e-id').value=id;
  document.getElementById('e-delete-btn').style.display='block';
  openModal('modal-expense');
}
function saveExpense() {
  const nome = document.getElementById('e-nome').value.trim();
  if(!nome) { alert('Inserisci un nome'); return; }
  const data = {
    nome,
    importo: parseFloat(document.getElementById('e-importo').value)||0,
    acconto: parseFloat(document.getElementById('e-acconto').value)||0,
    note: document.getElementById('e-note').value.trim(),
  };
  const eid = document.getElementById('e-id').value;
  if(eid) {
    const idx = state.expenses.findIndex(x=>x.id===parseInt(eid));
    if(idx>=0) state.expenses[idx]={...state.expenses[idx],...data};
  } else {
    state.expenses.push({id: state.nextEid++, ...data});
  }
  save(); closeModal('modal-expense'); renderAll();
}
function deleteExpense() {
  const eid = document.getElementById('e-id').value;
  if(!eid || !confirm('Eliminare questa spesa?')) return;
  state.expenses = state.expenses.filter(x=>x.id!==parseInt(eid));
  save(); closeModal('modal-expense'); renderAll();
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(el=>{
  el.addEventListener('click', e=>{ if(e.target===el) el.classList.remove('open'); });
});

// ── TAB ───────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab=tab;
  ['home','invitati','spese'].forEach(t=>{
    document.getElementById('page-'+t).classList.toggle('active', t===tab);
    document.getElementById('tb-'+t).classList.toggle('active', t===tab);
  });
  document.querySelectorAll('.tab').forEach((el,i)=>{
    el.classList.toggle('active', ['home','invitati','spese'][i]===tab);
  });
  renderAll();
}

function renderAll() { renderHome(); renderGuests(); renderExpenses(); }

// ── INIT ──────────────────────────────────────────────────────────────────────
const today = new Date();
document.getElementById('topbar-date').textContent = today.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});
renderAll();
</script>
